<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>기기 화면 크기 검증</title><style>body{margin:0;background:#303646;color:white;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center}button{padding:10px}iframe{display:block;border:0;background:#080d24;margin:0 auto}</style></head><body><header><strong>실행 화면 크기 검증</strong><button onclick="resize(1366,768)">노트북 1366 × 768</button><button onclick="resize(768,1024)">태블릿 768 × 1024</button><button onclick="resize(390,844)">모바일 390 × 844</button><span id="size">768 × 1024</span></header><iframe title="별빛 탐구 앱 실행" src="/" width="768" height="1024"></iframe><script>function resize(w,h){let f=document.querySelector('iframe');f.width=w;f.height=h;document.querySelector('#size').textContent=w+' × '+h}</script></body></html>
